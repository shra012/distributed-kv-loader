# Three-node int32-key configuration with input on every node.
version=1
node_count=3
schema=id:int32,name:string,score:int32
key_field=id
input.0=../data/int-node0.tsv
input.1=../data/int-node1.tsv
input.2=../data/int-node2.tsv
batch_bytes=262144
channel_bytes=1048576
inbound_queue_batches=8
max_record_bytes=65536
read_buffer_bytes=1048576
