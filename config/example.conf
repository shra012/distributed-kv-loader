# Three-node string-key example with one receiver-only node.
version=1
node_count=3
schema=id:string,name:string,age:int32
key_field=id
input.0=../data/node0.tsv
input.1=../data/node1.tsv
input.2=-
batch_bytes=262144
channel_bytes=1048576
inbound_queue_batches=8
max_record_bytes=65536
read_buffer_bytes=1048576
