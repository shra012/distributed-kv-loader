# Five-node string-key configuration with input on every node.
version=1
node_count=5
schema=id:string,name:string,age:int32
key_field=id
input.0=../data/node0.tsv
input.1=../data/node1.tsv
input.2=../data/node2.tsv
input.3=../data/node3.tsv
input.4=../data/node4.tsv
batch_bytes=262144
channel_bytes=1048576
inbound_queue_batches=8
max_record_bytes=65536
read_buffer_bytes=1048576
